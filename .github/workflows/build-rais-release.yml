name: Build Rais Thu Chi (Release APK + AAB)

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Tên ZIP ở thư mục gốc repo (để trống = tự chọn ZIP dự án mới nhất)'
        required: false
        type: string
        default: ''
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-rais-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HAS_RELEASE_KEY: ${{ secrets.RAIS_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # Do not enable Gradle cache here: the Gradle project is inside a ZIP,
          # so setup-java cannot find a build.gradle at repository checkout time.

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: Không tìm thấy sdkmanager trong $ANDROID_HOME/cmdline-tools trên runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Select ZIP and extract Android project
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_ZIP:-}"
          zip_name=""

          if [[ -n "${requested//[[:space:]]/}" ]]; then
            # Accept only a ZIP directly in the repository root.
            if [[ "$requested" == */* || "$requested" == *".."* || "${requested,,}" != *.zip ]]; then
              echo "ERROR: zip_name phải là tên file .zip ở thư mục gốc repo, không nhập đường dẫn."
              exit 1
            fi
            [[ -f "$requested" ]] || { echo "ERROR: Không tìm thấy file: $requested"; exit 1; }
            if ! unzip -Z1 "$requested" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
              echo "ERROR: $requested không chứa settings.gradle/settings.gradle.kts."
              exit 1
            fi
            zip_name="$requested"
          else
            # Pick the eligible root-level project ZIP whose latest Git commit is newest.
            newest_timestamp=-1
            while IFS= read -r -d '' candidate; do
              if ! unzip -Z1 "$candidate" 2>/dev/null | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
                continue
              fi
              timestamp="$(git log -1 --format=%ct -- "$candidate" 2>/dev/null || true)"
              [[ "$timestamp" =~ ^[0-9]+$ ]] || timestamp=0
              if (( timestamp > newest_timestamp )); then
                newest_timestamp=$timestamp
                zip_name="$candidate"
              fi
            done < <(find . -maxdepth 1 -type f -iname '*.zip' -print0)
            [[ -n "$zip_name" ]] || { echo "ERROR: Không có ZIP dự án Android hợp lệ ở thư mục gốc repo."; exit 1; }
          fi

          echo "Selected project ZIP: $zip_name"
          echo "PROJECT_ZIP=$zip_name" >> "$GITHUB_ENV"
          rm -rf extracted rais-project
          mkdir -p extracted rais-project
          unzip -q "$zip_name" -d extracted

          if [[ -f extracted/settings.gradle || -f extracted/settings.gradle.kts ]]; then
            cp -a extracted/. rais-project/
          else
            settings_file="$(find extracted -mindepth 2 -maxdepth 6 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            [[ -n "$settings_file" ]] || { echo "ERROR: ZIP không có settings.gradle."; exit 1; }
            project_dir="$(dirname "$settings_file")"
            cp -a "$project_dir"/. rais-project/
          fi

          if [[ ! -f rais-project/app/build.gradle && ! -f rais-project/app/build.gradle.kts ]]; then
            echo "ERROR: Không thấy app/build.gradle hoặc app/build.gradle.kts trong ZIP đã chọn."
            exit 1
          fi
          echo "Extracted project files:"
          ls -la rais-project

      - name: Require permanent release signing key
        if: env.HAS_RELEASE_KEY != 'true'
        shell: bash
        run: |
          echo "ERROR: Thiếu GitHub Secret RAIS_KEYSTORE_BASE64."
          echo "Cấu hình đủ 4 secrets: RAIS_KEYSTORE_BASE64, RAIS_KEYSTORE_PASSWORD, RAIS_KEY_ALIAS, RAIS_KEY_PASSWORD."
          echo "Không tạo APK debug thay cho bản phát hành vì bản debug có thể không cập nhật đè được bản release."
          exit 1

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RAIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RAIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RAIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RAIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo "ERROR: Một hoặc nhiều GitHub Secrets ký phát hành còn thiếu."; exit 1;
          }

      - name: Configure release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RAIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RAIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RAIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RAIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rais-release.jks"
          test -s "$RUNNER_TEMP/rais-release.jks"
          echo "RAIS_KEYSTORE_FILE=$RUNNER_TEMP/rais-release.jks" >> "$GITHUB_ENV"
          echo "RAIS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RAIS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RAIS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        working-directory: rais-project
        shell: bash
        run: gradle --no-daemon clean assembleRelease bundleRelease --stacktrace

      - name: Verify build outputs
        working-directory: rais-project
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          [[ -s "$apk" ]] || { echo "ERROR: Không tìm thấy APK release tại $apk"; find app/build/outputs -type f -print || true; exit 1; }
          [[ -s "$aab" ]] || { echo "ERROR: Không tìm thấy AAB release tại $aab"; find app/build/outputs -type f -print || true; exit 1; }
          echo "Release artifacts verified:"
          ls -lh "$apk" "$aab"

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Rais-ThuChi-SIGNED-RELEASE
          path: |
            rais-project/app/build/outputs/apk/release/*.apk
            rais-project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
